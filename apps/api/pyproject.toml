[project]
name = "prospect-api"
version = "0.1.0"
requires-python = ">=3.12"
# fastapi/uvicorn: HTTP API (ADR-001). pydantic-settings: env-var config (deployment rule 9).
# sqlalchemy/alembic: ORM + migrations (AGENTS rule 8). psycopg: PostgreSQL driver.
# boto3: S3-compatible client for private object storage (Cloudflare R2, ADR-005).
# pymupdf: PDF text, layout and table extraction (PRD §12; AGPL-3.0, see README).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pymupdf>=1.24",
]

[dependency-groups]
# pytest/httpx: tests + TestClient. ruff: lint + format + import order. mypy: type checking.
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "moto[server]>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle, I: import order, B: bugbear, UP: modern syntax.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["app", "migrations"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

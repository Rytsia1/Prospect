[project]
name = "prospect-api"
version = "0.1.0"
requires-python = ">=3.12"
# fastapi/uvicorn: HTTP API (ADR-001). pydantic-settings: env-var config (deployment rule 9).
# sqlalchemy/alembic: ORM + migrations (AGENTS rule 8). psycopg: PostgreSQL driver.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

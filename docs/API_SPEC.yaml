    ScenarioOut:
      type: object
      required: [id, user_id, name, base_period, base_revenue, revenue_growth_pct, scenario_revenue, revenue_change, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        company_id:
          type: string
          format: uuid
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        base_period:
          type: string
        base_revenue:
          type: string
        base_net_income:
          type: string
          nullable: true
        base_margin_pct:
          type: string
          nullable: true
        revenue_growth_pct:
          type: string
        net_margin_pct:
          type: string
          nullable: true
        scenario_revenue:
          type: string
        scenario_net_income:
          type: string
          nullable: true
        revenue_change:
          type: string
        net_income_change:
          type: string
          nullable: true
        assumptions:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompanyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        ticker:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        currency:
          type: string
          default: "IDR"
        description:

        base_net_income:
          type: string
          nullable: true
        revenue_growth_pct:
          type: string
          default: "0.0"
        net_margin_pct:
          type: string
          nullable: true

    ScenarioCalculationResult:
      type: object
      required: [base_revenue, revenue_growth_pct, scenario_revenue, revenue_change, disclaimer]
      properties:
        base_revenue:
          type: string
        base_net_income:
          type: string
          nullable: true
        base_margin_pct:
          type: string
          nullable: true
        revenue_growth_pct:
          type: string
        net_margin_pct:
          type: string
          nullable: true
        scenario_revenue:
          type: string
        scenario_net_income:
          type: string
          nullable: true
        revenue_change:
          type: string
        net_income_change:
          type: string
          nullable: true
        disclaimer:
          type: string

    ScenarioCreate:
      type: object
      required: [name, base_period, base_revenue]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        company_id:
          type: string

openapi: 3.0.3
info:
  title: Prospect API
  version: 0.1.0
  description: Evidence-first financial document intelligence API.

servers:
  - url: /api/v1

security:
  - sessionCookie: []
  - sessionToken: []

# Every non-2xx response body is an Error. A document owned by another user returns the
# same 404 as a nonexistent one. Browsers authenticate with the session cookie and must send
# X-CSRF-Token (plus a trusted Origin/Referer) on POST/PATCH/DELETE, else 403 csrf_failed.
# Unknown query parameters are 400 unknown_parameter. Database or storage outages are 503.
# See docs/SECURITY.md.

paths:
  /sessions:
    post:
      summary: Start an anonymous single-user-mode session (replaced by real auth later)
      description: >
        Sets the session token (v1.<session_id>.<issued_at>.<expires_at>.<hmac>) as the
        HttpOnly, Secure, SameSite=Strict cookie __Host-prospect_session; the body never
        contains it. Rejected (401) when malformed, badly signed, expired, revoked or unknown.
        Rate limited per client IP; refused (403) from an untrusted Origin.
      security: []
      responses:
        "201":
          description: Session started; Set-Cookie carries the token
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "403":
          description: Untrusted Origin or Referer (login CSRF)
        "429":
          description: Rate limited; Retry-After gives the seconds to wait

  /sessions/refresh:
    post:
      summary: Exchange a valid session for a fresh one (same user); revokes the old session
      responses:
        "200":
          description: New session; Set-Cookie carries the new token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Missing, malformed, expired, revoked or unknown session
        "429":
          description: Rate limited (Retry-After header)

  /sessions/current:
    get:
      summary: The current session's times and CSRF token (the cookie itself is unreadable)
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: No valid session
    delete:
      summary: Revoke the current session (sign out) and clear the cookie
      responses:
        "204":
          description: Revoked

  /documents:
    post:
      summary: Create a document and a signed upload URL (direct-to-storage upload)
      description: >
        The browser PUTs the PDF to `upload.url` with `upload.headers`, then calls
        POST /documents/{documentId}/complete. The URL expires at `upload.expires_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentCreate"
      responses:
        "201":
          description: Document created in UPLOADING state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUpload"
        "413":
          description: Declared size exceeds MAX_UPLOAD_BYTES (code file_too_large)
        "415":
          description: content_type is not application/pdf (code unsupported_file_type)

    get:
      summary: List the current user's documents, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Document"

  /documents/{documentId}/complete:
    post:
      summary: Verify the uploaded bytes server-side and queue processing
      description: >
        Checks the stored object's size and PDF signature. Success sets UPLOADED and creates a
        processing job. Idempotent once the document has left UPLOADING.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document (UPLOADED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "409":
          description: File not uploaded yet (code upload_not_found); safe to retry
        "422":
          description: Stored file is not a valid PDF or its size differs (code invalid_upload); document becomes FAILED

  /documents/{documentId}/download-url:
    get:
      summary: Short-lived signed URL to read the private PDF
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Signed URL
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "409":
          description: File not available (UPLOADING or FAILED)

  /documents/{documentId}:
    get:
      summary: Get document metadata and processing state
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

    patch:
      summary: Update document metadata (company name)
      description: >
        The company name groups the user's reports into one company workspace (whitespace is
        collapsed; matching is case-insensitive). null clears it.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name]
              properties:
                company_name:
                  type: string
                  maxLength: 200
                  nullable: true
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

    delete:
      summary: Delete a document, its stored file and everything extracted from it
      description: >
        Pages, sections, chunks, evidence, facts, calculations, jobs, reviews, quality issues,
        comparisons and document-based scenarios are deleted with it; companies, watchlists and
        the audit trail are not. Storage is deleted first, so a failure (503) changes nothing and
        can be retried. Repeating the delete answers 404.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted
        "404":
          description: No such document for this user
        "503":
          description: Storage or database unavailable; nothing was deleted

  /documents/{documentId}/pages:
    get:
      summary: Page summaries in page order (available once the document is processed)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Pages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [page_number, extraction_status, char_count]
                      properties:
                        page_number:
                          type: integer
                          description: 1-based physical page, as a PDF viewer numbers it
                        label:
                          type: string
                          nullable: true
                          description: Printed page label defined by the PDF, if any
                        extraction_status:
                          type: string
                          enum: [success, partial, failed]
                        char_count:
                          type: integer

  /documents/{documentId}/sections:
    get:
      summary: Detected sections in document order
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, ordinal, start_page, end_page]
                      properties:
                        id:
                          type: string
                          format: uuid
                        ordinal:
                          type: integer
                        title:
                          type: string
                          nullable: true
                          description: Verbatim heading text; null when no heading was detected
                        start_page:
                          type: integer
                        end_page:
                          type: integer

  /documents/{documentId}/pages/{pageNumber}:
    get:
      summary: Get one page's extracted text
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                type: object
                required: [page_number, extraction_status, text]
                properties:
                  page_number:
                    type: integer
                  label:
                    type: string
                    nullable: true
                  extraction_status:
                    type: string
                    enum: [success, partial, failed]
                  text:
                    type: string
                  width:
                    type: number
                    nullable: true
                  height:
                    type: number
                    nullable: true
        "404":
          description: Document or page not found

  /documents/{documentId}/metrics:
    get:
      summary: Get extracted financial facts with their evidence (paged)
      description: >
        Paged in the database: limit (default 100, at most 500; larger is 422) and offset;
        next_offset is null on the last page.
        Rate limits (429 + Retry-After), quotas (409/429 quota_exceeded) and size limits
        (413 file_too_large, financial_data_too_large, export_too_large) apply across the API;
        see docs/SECURITY.md.
        Items with status needs_review are kept for audit and must not be presented as facts.
        Monetary values are decimal strings in full currency units, never JSON numbers.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Financial facts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinancialFact"

  /documents/{documentId}/calculations:
    get:
      summary: Get deterministic ratios with their formula and source facts
      description: >
        Computed in application code from accepted facts, never by an LLM. value is a plain ratio
        at full precision as a decimal string (0.181 = 18.1%); round only for display. A missing
        input, a zero denominator, or incompatible inputs give status not_possible with a reason,
        never a zero.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Calculations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Calculation"

  /documents/{documentId}/financials:
    get:
      summary: Timeline, dashboard, reconciliation and data quality
      description: >
        Derived on read from the canonical financial facts; nothing is stored separately.
        scope=company combines every READY report of the same user with the same company name
        (a document without a company is always scope=document). Periods are normalized to
        fiscal years only when the source establishes them. A metric/period reported by several
        documents is one value when they agree (primary source: the report whose own latest year
        it is) and a conflict, with every source listed, when they disagree. Ratios and
        year-over-year changes come from the deterministic calculation engine.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: scope
          in: query
          schema:
            type: string
            enum: [document, company]
            default: document
      responses:
        "200":
          description: Workspace financials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Financials"

  /documents/{documentId}/evidence/{evidenceId}:
    get:
      summary: One fact and its source, for the evidence explorer
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The fact and its evidence
          content:
            application/json:
              schema:
                type: object
                required: [document, fact]
                properties:
                  document:
                    $ref: "#/components/schemas/DocumentRef"
                  fact:
                    $ref: "#/components/schemas/FinancialFact"
        "404":
          description: Not found (also for evidence of another document or another user)

  /documents/{documentId}/export:
    get:
      summary: Export facts, calculations, reconciliation and evidence
      description: >
        Serializes the same payload as /financials; never recalculates. Monetary values are exact
        decimals in full currency units (CSV text, JSON strings, XLSX number cells written as exact
        decimal text). CSV carries the facts table (with source page, section and text); JSON and
        XLSX carry sheets Financial Facts, Calculations, Reconciliation, Evidence. Text cells that
        start with = + - @ are prefixed with ' in CSV (formula injection).
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, xlsx]
            default: csv
        - name: scope
          in: query
          schema:
            type: string
            enum: [document, company]
            default: document
        - name: periods
          in: query
          description: Normalized periods to include (repeatable); omitted means all
          schema:
            type: array
            items:
              type: string
        - name: metrics
          in: query
          description: >
            Fact metrics and/or calculation metrics (revenue_growth, net_margin, roa, roe,
            debt_to_equity, current_ratio) and "reconciliation" (repeatable); omitted means all
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: The export file (Content-Disposition attachment)
          content:
            text/csv: {}
            application/json: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}

  /research/query:
    post:
      summary: Ask a source-grounded research question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchQuery"
      responses:
        "200":
          description: Research answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchAnswer"

  /documents/diff:
    post:
      summary: Compare two documents deterministically
      description: Returns metadata diff, structured financial facts diff, section diff, and unified text diff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentDiffRequest"
      responses:
        "200":
          description: Document comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDiffResponse"

  /documents/{documentId}/diff:
    get:
      summary: Compare a document with a target document
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - name: target_document_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDiffResponse"

  /financial-facts/review:
    get:
      summary: List financial facts for extraction review
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, needs_review, pending, pending_review, accepted, corrected, rejected]
        - name: confidence_tier
          in: query
          schema:
            type: string
            enum: [high, medium, low]
        - name: document_id
          in: query
          schema:
            type: string
            format: uuid
        - name: metric
          in: query
          schema:
            type: string
            maxLength: 64
        - name: period
          in: query
          schema:
            type: string
            maxLength: 40
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: document_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated review items
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FactReviewItem"
                  total:
                    type: integer

  /financial-facts/{factId}/accept:
    post:
      summary: Accept an extracted financial fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted financial fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactReviewItem"

  /financial-facts/{factId}/correct:
    post:
      summary: Correct a financial fact while preserving extraction history
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactCorrectionRequest"
      responses:
        "200":
          description: Corrected financial fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactReviewItem"

  /financial-facts/{factId}/reject:
    post:
      summary: Reject an extracted financial fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactRejectionRequest"
      responses:
        "200":
          description: Rejected financial fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactReviewItem"

  /financial-facts/{factId}/history:
    get:
      summary: Get revision history of a financial fact
      parameters:
        - name: factId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of historical review events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FactHistoryItem"

  /data-quality:
    get:
      summary: Run data quality rules and list detected anomalies
      parameters:
        - name: document_id
          in: query
          schema:
            type: string
            format: uuid
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved, ignored]
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, error]
        - name: rule_code
          in: query
          schema:
            type: string
        - name: run_fresh
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Data quality issues and summary counts
          content:
            application/json:
              schema:
                type: object
                required: [items, summary]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataQualityIssueOut"
                  summary:
                    $ref: "#/components/schemas/DataQualitySummary"

  /data-quality/{issueId}:
    patch:
      summary: Update data quality anomaly status
      parameters:
        - name: issueId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataQualityIssueUpdate"
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualityIssueOut"

  /scenarios/calculate:
    post:
      summary: Compute deterministic scenario preview without persisting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioCalculationRequest"
      responses:
        "200":
          description: Calculated scenario outputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioCalculationResult"

  /scenarios:
    get:
      summary: List user scenarios
      parameters:
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
        - name: document_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of saved scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScenarioOut"
    post:
      summary: Create and save a user scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioCreate"
      responses:
        "201":
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioOut"

  /scenarios/{scenarioId}:
    get:
      summary: Get a specific scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scenario details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioOut"
    patch:
      summary: Update an existing scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScenarioUpdate"
      responses:
        "200":
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioOut"
    delete:
      summary: Delete a scenario
      parameters:
        - name: scenarioId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted successfully

  /companies:
    get:
      summary: List companies in user workspace
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyOut"
    post:
      summary: Create a new company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyCreate"
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOut"

  /companies/{companyId}:
    get:
      summary: Get company details, documents, and financials
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Company details with associated documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOut"
    patch:
      summary: Update company metadata
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOut"
    delete:
      summary: Delete company (detaches associated documents)
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Company deleted

  /companies/{companyId}/documents:
    post:
      summary: Associate a document with a company
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyDocumentAttach"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyOut"

  /companies/{companyId}/documents/{documentId}:
    delete:
      summary: Detach a document from a company
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Document detached

  /watchlist:
    get:
      summary: List user watchlist with factual metrics
      responses:
        "200":
          description: Watchlist entries with factual revenue, net income, YoY growth
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchlistEntryOut"
    post:
      summary: Add company to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistCreate"
      responses:
        "201":
          description: Watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistEntryOut"

  /watchlist/{companyId}:
    delete:
      summary: Remove company from watchlist
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed from watchlist

  /audit:
    get:
      summary: List append-only audit trail events
      parameters:
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: string
        - name: event_type
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated audit events
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEventOut"
                  total:
                    type: integer

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-prospect_session
      description: Browsers. Writes also need X-CSRF-Token (from SessionInfo) and a trusted Origin.
    sessionToken:
      type: http
      scheme: bearer
      description: Non-browser clients (the same token); no CSRF token needed.

  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    FinancialFact:
      type: object
      required: [id, metric, metric_name, value, scale, original_text, period_type, period_label, confidence, status, review_reasons, extraction_method, evidence]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        metric:
          type: string
          enum: [revenue, gross_profit, operating_income, net_income, total_assets, total_liabilities, equity, cash, total_debt]
        metric_name:
          type: string
        value:
          type: string
          description: Decimal string, full value in currency units, sign preserved (e.g. "-1250000000")
        currency:
          type: string
          nullable: true
          description: ISO 4217; null only on needs_review items (never guessed)
        scale:
          type: string
          enum: [units, thousands, millions, billions, trillions]
          description: The scale the source printed the value in
        original_text:
          type: string
          description: The value exactly as printed, e.g. "(1,250)"
        period_type:
          type: string
          enum: [annual, quarter, interim, instant]
        period_label:
          type: string
          description: FY2025, Q4 2025, 2025-12-31 (instant), 9M ended 2025-09-30
        period_end:
          type: string
          format: date
          nullable: true
          description: Null when the document states only the year
        fiscal_year:
          type: integer
          nullable: true
        confidence:
          type: string
          description: Deterministic 0-1 score from how the value was found; not a probability
        status:
          type: string
          enum: [accepted, needs_review, corrected, rejected]
        review_reasons:
          type: array
          items:
            type: string
        extraction_method:
          type: string
          enum: [parser]
        evidence:
          type: object
          required: [id, page_number, chunk_id, kind, content]
          properties:
            id:
              type: string
              format: uuid
            page_number:
              type: integer
            page_label:
              type: string
              nullable: true
            section_title:
              type: string
              nullable: true
            chunk_id:
              type: string
              format: uuid
            kind:
              type: string
              enum: [table_row, text_line]
            content:
              type: string
              description: Verbatim source row; a substring of the page text
            header:
              type: string
              nullable: true
            unit:
              type: string
              nullable: true

    SessionInfo:
      type: object
      required: [issued_at, expires_at, csrf_token]
      properties:
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          description: Send as X-CSRF-Token on POST/PATCH/DELETE; changes with every session

    DocumentRef:
      type: object
      required: [id, filename]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        fiscal_year:
          type: integer
          nullable: true
        company_name:
          type: string
          nullable: true

    WorkspaceResult:
      type: object
      description: A calculation computed on read (ratio or year-over-year change)
      required: [metric, name, formula_key, formula, period, period_type, period_label, status, value, unit, notes, input_fact_ids]
      properties:
        metric:
          type: string
        name:
          type: string
        formula_key:
          type: string
        formula:
          type: string
        period:
          type: string
          description: Normalized period (FY2025, or a balance date without an established fiscal year)
        period_type:
          type: string
          enum: [annual, instant]
        period_label:
          type: string
        status:
          type: string
          enum: [calculated, not_possible]
        value:
          type: string
          nullable: true
        unit:
          type: string
          enum: [percent, times]
        reason_code:
          type: string
          nullable: true
          enum: [MISSING_INPUT, DIVISION_BY_ZERO, INCOMPATIBLE_INPUTS, null]
        reason:
          type: string
          nullable: true
        notes:
          type: array
          items:
            type: string
        input_fact_ids:
          type: array
          items:
            type: string
            format: uuid

    Financials:
      type: object
      required: [scope, documents, metrics, periods, period_basis, facts, fact_periods, cells, calculations, reconciliations, quality]
      properties:
        scope:
          type: string
          enum: [document, company]
        company_name:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRef"
        metrics:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              name:
                type: string
        periods:
          type: array
          description: Oldest first
          items:
            type: string
        period_basis:
          type: object
          additionalProperties:
            type: string
            enum: [fiscal_year, fiscal_year_end, date]
        facts:
          type: array
          items:
            $ref: "#/components/schemas/FinancialFact"
        fact_periods:
          type: object
          description: fact id → normalized period
          additionalProperties:
            type: string
        cells:
          type: array
          items:
            type: object
            required: [metric, period, status, fact_ids]
            properties:
              metric:
                type: string
              period:
                type: string
              status:
                type: string
                enum: [value, conflict, needs_review]
              fact_ids:
                type: array
                items:
                  type: string
                  format: uuid
              primary_fact_id:
                type: string
                format: uuid
                nullable: true
                description: The value shown; null for conflicts and review items
              change:
                allOf:
                  - $ref: "#/components/schemas/WorkspaceResult"
                nullable: true
        calculations:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceResult"
        reconciliations:
          type: array
          items:
            type: object
            required: [check, formula, period, status, fact_ids, problems]
            properties:
              check:
                type: string
                enum: [balance_sheet]
              formula:
                type: string
              period:
                type: string
              status:
                type: string
                enum: [BALANCED, ROUNDING_DIFFERENCE, MISMATCH, INSUFFICIENT_DATA]
              outcome:
                type: string
                enum: [PASS, FAIL, NOT_CHECKABLE]
                description: Standardized reconciliation check outcome
              expected_relationship:
                type: string
                example: assets = liabilities + equity
              fact_ids:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
              actual_values:
                type: object
                additionalProperties:
                  type: string
              source_evidence:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
              liabilities_plus_equity:
                type: string
                nullable: true
              difference:
                type: string
                nullable: true
                description: assets − (liabilities + equity)
              tolerance:
                type: string
                nullable: true
              currency:
                type: string
                nullable: true
              problems:
                type: array
                items:
                  type: string
        quality:
          type: array
          items:
            type: object
            required: [period, level, message]
            properties:
              period:
                type: string
              level:
                type: string
                enum: [ok, warning, info]
              message:
                type: string
              metric:
                type: string
                nullable: true

    Calculation:
      type: object
      required: [id, metric, name, formula_key, formula, period_type, period_label, status, value, unit, notes, inputs]
      properties:
        id:
          type: string
          format: uuid
        metric:
          type: string
          enum: [revenue_growth, net_margin, roa, roe, debt_to_equity, current_ratio]
        name:
          type: string
        formula_key:
          type: string
          enum: [revenue_growth, net_margin, roa_average_assets, roa_ending_assets, roe_average_equity, roe_ending_equity, debt_to_equity, current_ratio]
          description: The *_ending_* variants are used, and labeled, only when the opening balance is missing
        formula:
          type: string
        period_type:
          type: string
          enum: [annual, instant]
        period_label:
          type: string
          description: FY2025 for annual ratios, the balance-sheet date for debt-to-equity and current ratio
        status:
          type: string
          enum: [calculated, not_possible]
        value:
          type: string
          nullable: true
          description: Plain ratio, full precision; null unless calculated
        unit:
          type: string
          enum: [percent, times]
          description: Presentation only
        reason_code:
          type: string
          nullable: true
          enum: [MISSING_INPUT, DIVISION_BY_ZERO, INCOMPATIBLE_INPUTS, null]
        reason:
          type: string
          nullable: true
          description: e.g. "Total equity at 2025-12-31 was not found."
        notes:
          type: array
          items:
            type: string
          description: Caveats, e.g. a negative denominator or the ending-balance variant
        inputs:
          type: array
          description: Source facts (with evidence) used, or those found when not possible
          items:
            $ref: "#/components/schemas/FinancialFact"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items: {}

    DocumentCreate:
      type: object
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          maxLength: 1000
          description: >
            Display only. Stored NFKC-normalized, last path component, without control or format
            characters, at most 255 characters.
        content_type:
          type: string
          enum: [application/pdf]
        size_bytes:
          type: integer
          minimum: 1
        document_type:
          type: string
          enum: [annual_report, financial_statement, prospectus]
          default: annual_report
        fiscal_year:
          type: integer
          nullable: true
        company_name:
          type: string
          maxLength: 200
          nullable: true
          description: Groups the user's reports into one company workspace
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >
            SHA-256 of the file (hex). Signed into the upload URL as x-amz-checksum-sha256 (the
            upload headers include it); checked again on completion and by the worker.

    DocumentUpload:
      type: object
      required: [document, upload]
      properties:
        document:
          $ref: "#/components/schemas/Document"
        upload:
          type: object
          required: [url, method, headers, expires_at]
          properties:
            url:
              type: string
            method:
              type: string
              enum: [PUT]
            headers:
              type: object
              additionalProperties:
                type: string
            expires_at:
              type: string
              format: date-time

    Document:
      type: object
      required: [id, filename, document_type, mime_type, size_bytes, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        document_type:
          type: string
          enum: [annual_report, financial_statement, prospectus]
        fiscal_year:
          type: integer
          nullable: true
        company_name:
          type: string
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        mime_type:
          type: string
        size_bytes:
          type: integer
        status:
          type: string
          enum: [UPLOADING, UPLOADED, QUEUED, PROCESSING, EXTRACTING, INDEXING, READY, FAILED]
        processing_error:
          type: string
          nullable: true
        threat_scan:
          type: string
          enum: [clean, not_scanned]
          nullable: true
          description: Threat scan result; null until the worker reaches the scan
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        delete_after:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >-
            When retention deletes the document (DOCUMENT_RETENTION_DAYS after upload); null when
            retention is off. The whole workspace is deleted sooner if its session ends.

    ResearchQuery:
      type: object
      required: [question]
      properties:
        document_ids:
          type: array
          items:
            type: string
            format: uuid
        session_id:
          type: string
          format: uuid
        question:
          type: string

    ResearchAnswer:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        limitations:
          type: array
          items:
            type: string

    Citation:
      type: object
      required: [evidence_id, document_id, page]
      properties:
        evidence_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        page:
          type: integer
        excerpt:
          type: string

    DocumentDiffRequest:
      type: object
      required: [document_a_id, document_b_id]
      properties:
        document_a_id:
          type: string
          format: uuid
        document_b_id:
          type: string
          format: uuid

    DocumentDiffResponse:
      type: object
      required: [document_a_id, document_b_id, document_a_filename, document_b_filename, metadata_diff, financial_diff, section_diff, text_diff]
      properties:
        document_a_id:
          type: string
          format: uuid
        document_b_id:
          type: string
          format: uuid
        document_a_filename:
          type: string
        document_b_filename:
          type: string
        metadata_diff:
          type: array
          items:
            $ref: "#/components/schemas/DiffMetadataItem"
        financial_diff:
          type: array
          items:
            $ref: "#/components/schemas/FinancialDiffItem"
        section_diff:
          type: array
          items:
            $ref: "#/components/schemas/SectionDiffItem"
        text_diff:
          type: array
          items:
            $ref: "#/components/schemas/TextDiffSection"

    DiffMetadataItem:
      type: object
      required: [field, label, changed]
      properties:
        field:
          type: string
        label:
          type: string
        value_a:
          type: string
          nullable: true
        value_b:
          type: string
          nullable: true
        changed:
          type: boolean

    FinancialDiffItem:
      type: object
      required: [metric, metric_name, period, status]
      properties:
        metric:
          type: string
        metric_name:
          type: string
        period:
          type: string
        status:
          type: string
          enum: [added, removed, changed, unchanged]
        is_restatement:
          type: boolean
          default: false
        notes:
          type: array
          items:
            type: string
        value_a:
          type: string
          nullable: true
        currency_a:
          type: string
          nullable: true
        scale_a:
          type: string
          nullable: true
        evidence_a:
          $ref: "#/components/schemas/Evidence"
          nullable: true
        value_b:
          type: string
          nullable: true
        currency_b:
          type: string
          nullable: true
        scale_b:
          type: string
          nullable: true
        evidence_b:
          $ref: "#/components/schemas/Evidence"
          nullable: true
        absolute_change:
          type: string
          nullable: true
        percentage_change:
          type: string
          nullable: true
        change_formatted:
          type: string
          nullable: true

    SectionDiffItem:
      type: object
      required: [status]
      properties:
        title:
          type: string
          nullable: true
        ordinal_a:
          type: integer
          nullable: true
        ordinal_b:
          type: integer
          nullable: true
        page_range_a:
          type: string
          nullable: true
        page_range_b:
          type: string
          nullable: true
        status:
          type: string
          enum: [added, removed, changed, unchanged, uncertain]

    TextDiffSection:
      type: object
      required: [section_title, diff_lines, additions, deletions]
      properties:
        section_title:
          type: string
        page_a:
          type: integer
          nullable: true
        page_b:
          type: integer
          nullable: true
        diff_lines:
          type: array
          items:
            type: string
        additions:
          type: integer
        deletions:
          type: integer

    FactReviewItem:
      type: object
      required: [id, document_id, metric, metric_name, value, scale, original_text, period_type, period_label, confidence, status, review_reasons, extraction_method]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        metric:
          type: string
        metric_name:
          type: string
        value:
          type: string
        currency:
          type: string
          nullable: true
        scale:
          type: string
        original_text:
          type: string
        period_type:
          type: string
        period_label:
          type: string
        confidence:
          type: string
        status:
          type: string
        review_reasons:
          type: array
          items:
            type: string
        extraction_method:
          type: string
        evidence:
          type: object
          nullable: true

    FactCorrectionRequest:
      type: object
      properties:
        value:
          type: string
        currency:
          type: string
        scale:
          type: string
        period_label:
          type: string
        metric:
          type: string
        reason:
          type: string

    FactRejectionRequest:
      type: object
      properties:
        reason:
          type: string

    FactHistoryItem:
      type: object
      required: [id, fact_id, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        fact_id:
          type: string
          format: uuid
        action:
          type: string
        original_value:
          type: string
          nullable: true
        new_value:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        actor_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    DataQualityIssueOut:
      type: object
      required: [id, rule_code, severity, status, description, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        document_id:
          type: string
          format: uuid
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        rule_code:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        status:
          type: string
          enum: [open, acknowledged, resolved, ignored]
        metric:
          type: string
          nullable: true
        period_label:
          type: string
          nullable: true
        description:
          type: string
        evidence_id:
          type: string
          format: uuid
          nullable: true
        details:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DataQualityIssueUpdate:
      type: object
